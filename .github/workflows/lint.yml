name: Lint and build

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
            - run: bun install
            - run: bun run type-check
            - run: bun run lint
            - run: bun run test
            - run: bun run build
